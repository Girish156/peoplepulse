version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: peoplepulse-db
    environment:
      POSTGRES_DB: peoplepulse
      POSTGRES_USER: peoplepulse
      POSTGRES_PASSWORD: peoplepulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peoplepulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - peoplepulse-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peoplepulse-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://peoplepulse:peoplepulse@db:5432/peoplepulse
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
      DEBUG: "True"
      DEMO_MODE: "True"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - peoplepulse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: peoplepulse-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    networks:
      - peoplepulse-net

volumes:
  postgres_data:

networks:
  peoplepulse-net:
    driver: bridge

